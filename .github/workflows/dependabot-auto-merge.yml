name: Dependabot auto-merge

# Turns on GitHub's *native* auto-merge for Dependabot's grouped PRs (the
# GitHub Actions group, see .github/dependabot.yml). Native auto-merge does the
# merging itself once the required status checks pass; nothing in Dependabot
# can switch it on, so this workflow is only here to press that button. See:
# https://github.com/dependabot/dependabot-core/issues/4143
#
# All update types are included, semver-major among them: every PR is gated by
# a required CI check, so a breaking bump fails CI and is never merged.
#
# PREREQUISITES (repository settings, not something a workflow can enforce):
#   1. Settings > General > "Allow auto-merge" must be enabled.
#   2. `main` must be protected (branch protection rule or ruleset) with
#      "Require status checks to pass" selecting the CI job
#      "Julia 1.9 - ubuntu-latest - x64" (.github/workflows/CI.yml).
#   3. CI needs the `KAKIBOT_KEY` secret on Dependabot PRs, and workflows
#      triggered by Dependabot only see *Dependabot* secrets, so the key must
#      also be stored under Settings > Secrets and variables > Dependabot.
# Without (2), `gh pr merge --auto` finds nothing blocking the merge and
# merges the PR immediately, before CI has run. Without (3), CI fails on
# every Dependabot PR and nothing is ever merged.
#
# Deliberately uses no actions at all -- nothing to pin, nothing to update, and
# no third party in the merge path.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot updates
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # Note: deliberately does not check out the PR's code.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
